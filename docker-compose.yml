# GoFerMinutes2 — Docker Compose
# Запуск PostgreSQL + MongoDB для локальной разработки и защиты

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goferminutes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loader
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: truecode_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loader -d truecode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: goferminutes_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
